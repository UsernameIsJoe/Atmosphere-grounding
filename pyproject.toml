[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atmosphere-grounding"
version = "0.1.0"
description = "Weakly supervised visual grounding of urban atmosphere categories from Google place data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "python-dotenv>=1.0.0",
  "pyyaml>=6.0",
  "requests>=2.31.0",
  "pandas>=2.0.0",
  "pyarrow>=14.0.0",
  "networkx>=3.2",
  "pillow>=10.0.0",
  "numpy>=1.26.0",
  "tqdm>=4.66.0",
  "typer>=0.12.0",
  "rich>=13.0.0",
]

[project.optional-dependencies]
vision = [
  "torch>=2.1.0",
  "torchvision>=0.16.0",
  "transformers>=4.40.0",
  "sentencepiece>=0.2.0",
  "protobuf>=4.0.0",
  "open-clip-torch>=2.24.0",
]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
atmosphere = "atmosphere_grounding.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
