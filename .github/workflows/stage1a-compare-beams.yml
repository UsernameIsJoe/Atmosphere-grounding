name: Stage 1A beam diagnostic comparison
on:
  push:
    paths:
      - scripts/stage1a_beam_diagnostic_compare.py
      - .github/workflows/stage1a-compare-beams.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get successful beam artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for beam in 1 3 5; do
            mkdir -p "reports/beam_inputs/$beam"
            gh run download 41913297763 -R "$GH_REPO" -n "stage1a-aos-beam-$beam" -D "reports/beam_inputs/$beam"
          done
      - name: Compare frozen partial targets
        run: python scripts/stage1a_beam_diagnostic_compare.py
