name: Stage 1A Component 1 reconciled claims audit
on:
  push:
    paths:
      - scripts/stage1a_component1_reconcile.py
      - .github/workflows/stage1a-component1-reconcile.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download matched source, new JointIE and frozen GTS outputs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p reports/component1_reconcile_inputs
          gh run download 41920533478 -R "$GH_REPO" -n stage1a-component1-matched-audit -D reports/component1_reconcile_inputs/matched
          gh run download 41908682135 -R "$GH_REPO" -n absa-real-sentences-gts_joint_aste -D reports/component1_reconcile_inputs/gts
          gh run download 41923414224 -R "$GH_REPO" -n stage1a-component1-joint-gliner -D reports/component1_reconcile_inputs/joint
      - name: Reconcile independent candidate relationships without generating claims
        run: python scripts/stage1a_component1_reconcile.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage1a-component1-reconciled
          path: reports/component1_reconciled/
