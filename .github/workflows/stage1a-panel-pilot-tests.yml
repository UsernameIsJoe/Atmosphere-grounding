name: Stage 1A panel pilot (offline tests)

on:
  push:
    paths:
      - "scripts/stage1a_panel_pilot.py"
      - "scripts/stage1a_evidence_first_5.py"
      - "scripts/stage1a_direction_2.py"
      - "scripts/stage1a_integrated_5.py"
      - "tests/test_stage1a_integrated_5.py"
      - "configs/stage1a_direction_2_cases.json"
      - "tests/test_stage1a_direction_2.py"
      - "configs/stage1a_evidence_first_5.json"
      - "tests/test_stage1a_evidence_first_5.py"
      - "tests/test_stage1a_panel_pilot.py"
      - ".github/workflows/stage1a-panel-pilot-tests.yml"
  pull_request:
    paths:
      - "scripts/stage1a_panel_pilot.py"
      - "tests/test_stage1a_panel_pilot.py"
      - ".github/workflows/stage1a-panel-pilot-tests.yml"
  workflow_dispatch:

jobs:
  mechanics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Compile pilot code
        run: python -m py_compile scripts/stage1a_panel_pilot.py scripts/stage1a_evidence_first_5.py scripts/stage1a_direction_2.py scripts/stage1a_integrated_5.py
      - name: Run isolated tests
        run: python -m pytest -q tests/test_stage1a_panel_pilot.py tests/test_stage1a_evidence_first_5.py tests/test_stage1a_direction_2.py tests/test_stage1a_integrated_5.py
      - name: Verify frozen five-review input (no Ollama calls)
        run: python scripts/stage1a_evidence_first_5.py --prepare-only
      - name: Prepare source-only pilot (no Ollama calls)
        run: |
          python scripts/stage1a_panel_pilot.py --prepare-only --max-reviews 12 --output /tmp/stage1a-panel-ci
          test -s /tmp/stage1a-panel-ci/clauses.jsonl
          test -s /tmp/stage1a-panel-ci/manifest.json

      - name: Upload prepared real-review clauses
        uses: actions/upload-artifact@v4
        with:
          name: stage1a-real-review-clauses-12
          path: |
            /tmp/stage1a-panel-ci/clauses.jsonl
            /tmp/stage1a-panel-ci/manifest.json
          if-no-files-found: error
