name: Stage 1A PyABSA official ASTE candidate
on:
  push:
    paths:
      - scripts/stage1a_pyabsa_official_probe.py
      - .github/workflows/stage1a-pyabsa-official.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pyabsa-official:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install PyABSA with supported dependencies
        run: |
          python -m pip install 'torch>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pyabsa spacy
          python -m pip install 'update-checker==0.18.0'
          python -m spacy download en_core_web_sm
      - name: Run documented checkpoint on original reviews
        run: python -u scripts/stage1a_pyabsa_official_probe.py --checkpoint multilingual --output reports/stage1a_pyabsa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage1a-pyabsa-official-probe
          path: reports/stage1a_pyabsa/
