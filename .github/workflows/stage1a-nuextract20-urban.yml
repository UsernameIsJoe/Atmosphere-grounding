name: Stage 1A NuExtract 2.0 structured urban review pilot
on:
  push:
    paths:
      - scripts/stage1a_nuextract20_urban.py
      - .github/workflows/stage1a-nuextract20-urban.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nuextract20:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official inference dependencies
        run: |
          python -m pip install 'torch>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers>=4.47,<5' accelerate sentencepiece protobuf qwen-vl-utils spacy
          python -m spacy download en_core_web_sm
      - name: Run predeclared real sentence pilot
        run: python -u scripts/stage1a_nuextract20_urban.py --output reports/nuextract20_urban
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage1a-nuextract20-urban-results
          path: reports/nuextract20_urban/
