name: Stage 1A urban fine-tuned checkpoint availability audit
on:
  push:
    paths:
      - scripts/stage1a_urban_checkpoint_access.py
      - .github/workflows/stage1a-urban-checkpoint-access.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  search-specific-checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check model hubs and repository registries
        run: python scripts/stage1a_urban_checkpoint_access.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage1a-urban-checkpoint-access
          path: reports/urban_checkpoint_access.json
