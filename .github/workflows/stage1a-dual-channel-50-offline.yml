name: Stage1A dual-channel 50 offline checks

on:
  push:
    paths:
      - "scripts/stage1a_dual_channel_50.py"
      - "tests/test_stage1a_dual_channel_50.py"
      - ".github/workflows/stage1a-dual-channel-50-offline.yml"
  workflow_dispatch:

jobs:
  offline-mechanics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_stage1a_dual_channel_50.py
      - run: python scripts/stage1a_dual_channel_50.py --prepare-only --output "$RUNNER_TEMP/stage1a_dual_channel_50"
