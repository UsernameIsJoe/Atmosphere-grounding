name: Stage 1A Component 1 Ollama local runner checks
on:
  push:
    paths:
      - scripts/stage1a_component1_ollama.py
      - tests/test_stage1a_component1_ollama.py
      - scripts/stage1a_component1_ollama_audit.py
      - .github/workflows/stage1a-component1-ollama-checks.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile local Ollama runner and contract tests
        run: python -m py_compile scripts/stage1a_component1_ollama.py scripts/stage1a_component1_ollama_audit.py tests/test_stage1a_component1_ollama.py
      - name: Run strict provenance/verification contract tests
        run: python -m unittest discover -s tests -p test_stage1a_component1_ollama.py -v
      - name: Install corpus segmentation dependencies
        run: |
          python -m pip install spacy
          python -m spacy download en_core_web_sm
      - name: Check that the fixed real review corpus can be loaded
        run: python scripts/stage1a_component1_ollama.py --model qwen3:8b --check-only
