name: Stage 1A Qwen3 prompt readiness contract checks
on:
  push:
    paths:
      - scripts/stage1a_component1_prompt_readiness.py
      - scripts/stage1a_component1_prompt_review_packet.py
      - .github/workflows/stage1a-component1-prompt-readiness.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test Python syntax
        run: python -m py_compile scripts/stage1a_component1_prompt_readiness.py scripts/stage1a_component1_prompt_review_packet.py
      - name: Install source input dependencies
        run: |
          python -m pip install spacy
          python -m spacy download en_core_web_sm
      - name: Verify CLI imports and prompt variant definitions
        run: |
          python scripts/stage1a_component1_prompt_readiness.py --help
          python scripts/stage1a_component1_prompt_review_packet.py --help
          python -c "import sys;sys.path.insert(0,'scripts');import stage1a_component1_prompt_readiness as x;assert x.A1!=x.A2 and x.A1!=x.EXTRACT_SYSTEM and x.A2!=x.EXTRACT_SYSTEM and len(x.FIXED)==12"
