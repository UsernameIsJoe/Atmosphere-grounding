name: Stage 1A AOS controlled beam study
on:
  push:
    paths:
      - scripts/stage1a_aos_beam_study.py
      - .github/workflows/stage1a-aos-beam-study.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  beams:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        beam: [1, 3, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install compatible stack
        run: |
          python -m pip install 'torch>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers>=4.41,<5' 'huggingface_hub>=0.25,<1' numpy scikit-learn sentencepiece protobuf spacy
          python -m spacy download en_core_web_sm
      - name: Fixed corpus beam experiment
        run: python -u scripts/stage1a_aos_beam_study.py --beams "${{ matrix.beam }}" --output "reports/aos_beams/${{ matrix.beam }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage1a-aos-beam-${{ matrix.beam }}
          path: reports/aos_beams/
