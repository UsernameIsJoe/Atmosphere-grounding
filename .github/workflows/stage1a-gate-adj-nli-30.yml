name: Stage1A adjective and triple-NLI gate offline tests

on:
  push:
    paths:
      - "scripts/stage1a_gate_adj_nli_30.py"
      - "tests/test_stage1a_gate_adj_nli_30.py"
      - "scripts/stage1a_gate_rescue_segment_only.py"
      - "tests/test_stage1a_gate_rescue_segment_only.py"
      - ".github/workflows/stage1a-gate-adj-nli-30.yml"
  workflow_dispatch:

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_stage1a_gate_adj_nli_30.py tests/test_stage1a_gate_rescue_segment_only.py
      - run: python scripts/stage1a_gate_adj_nli_30.py --stage prepare --output "$RUNNER_TEMP/stage1a_gate_30"
