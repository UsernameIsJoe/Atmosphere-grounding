name: Stage 1A ABSA official sentence-level real-review inference

on:
  push:
    paths:
      - '.github/workflows/stage1a-absa-real-sentences.yml'
      - 'scripts/stage1a_absa_official_sentence_inference.py'
      - 'scripts/stage1a_absa_sentence_comparison.py'
      - 'tests/test_stage1a_absa_real_sentence_pipeline.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  sentence-inference:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        method: [aos_t5, gts_joint_aste, dependency]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install model runtime and source segmentation dependencies
        env:
          METHOD: ${{ matrix.method }}
        run: |
          python -m pip install 'pytest>=8,<10' 'spacy>=3.7,<4'
          python -m spacy download en_core_web_sm
          if [ "$METHOD" != dependency ]; then
            python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
            python -m pip install 'transformers>=4.41,<5' 'huggingface_hub>=0.25,<1' numpy scikit-learn sentencepiece protobuf
          fi
      - name: Compile sources and test on only original real reviews
        run: |
          python -m py_compile scripts/stage1a_absa_official_sentence_inference.py scripts/stage1a_absa_sentence_comparison.py
          python -m pytest -q tests/test_stage1a_absa_real_sentence_pipeline.py
      - name: Apply documented sentence-level inference protocol
        env:
          METHOD: ${{ matrix.method }}
        run: |
          python -u scripts/stage1a_absa_official_sentence_inference.py --method "$METHOD" --output "reports/absa_official_sentences/$METHOD"
      - name: Verify exact original-review offsets and source identity
        env:
          METHOD: ${{ matrix.method }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path('reports/absa_official_sentences')/os.environ['METHOD']
          rows=[json.loads(line) for line in (root/'review_cases.jsonl').read_text().splitlines() if line]
          summary=json.loads((root/'summary.json').read_text())
          assert len(rows)==20==summary['reviews']
          assert [x['row'] for x in rows]==summary['sample_rows']
          assert sum(len(x['sentences']) for x in rows)==summary['original_sentences']
          for review in rows:
              for sentence in review['sentences']:
                  a,b=sentence['start'],sentence['end']
                  assert review['review'][a:b]==sentence['text']
                  for rel in sentence['extraction']['relations']:
                      if rel.get('grounded'):
                          for key in ('aspect','opinion'):
                              span=rel[key]
                              assert review['review'][span['start']:span['end']]==span['text']
          print('All source offsets and original review IDs verified')
          PY
      - name: Archive every real-review sentence and prediction
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: absa-real-sentences-${{ matrix.method }}
          path: reports/absa_official_sentences/${{ matrix.method }}/
          if-no-files-found: warn

  paired-comparison:
    needs: sentence-inference
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: absa-real-sentences-aos_t5
          path: reports/absa_official_sentences/aos_t5
      - uses: actions/download-artifact@v4
        with:
          name: absa-real-sentences-gts_joint_aste
          path: reports/absa_official_sentences/gts_joint_aste
      - uses: actions/download-artifact@v4
        with:
          name: absa-real-sentences-dependency
          path: reports/absa_official_sentences/dependency
      - name: Retrieve previous frozen full-review scores
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p reports/absa_prior
          gh run download 41906619654 -R "$GH_REPO" -n stage1a-absa-real-review-transfer-v1 -D reports/absa_prior
      - name: Score same-source sentence-level versus whole-review evidence recovery
        run: |
          python scripts/stage1a_absa_sentence_comparison.py \
            --references data/evaluation/stage1a_absa_real_review_targets_v1.json \
            --prior-audit reports/absa_prior/summary.json \
            --aos reports/absa_official_sentences/aos_t5/review_cases.jsonl \
            --gts reports/absa_official_sentences/gts_joint_aste/review_cases.jsonl \
            --dependency reports/absa_official_sentences/dependency/review_cases.jsonl \
            --output reports/absa_official_sentence_comparison
      - name: Verify paired real-review evaluation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('reports/absa_official_sentence_comparison/comparison.json').read_text())
          assert x['n_original_reviews']==20
          assert x['n_reference_target_pairs']==29
          assert x['n_original_sentences']>=20
          assert set(x['per_model'])=={'aos_t5','gts_joint_aste','dependency_rules'}
          for result in x['per_model'].values():
              assert 0<=result['sentence_level_reference_target_recovered']<=29
              assert result['sentence_count']==x['n_original_sentences']
          print('Paired comparison verified; no independent accuracy inferred')
          PY
      - name: Archive reviewer-ready paired comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: absa-real-sentence-paired-comparison
          path: reports/absa_official_sentence_comparison/
          if-no-files-found: warn
