name: Stage 1A screen NLI checkpoint variations

on:
  push:
    paths:
      - '.github/workflows/stage1a-nli-checkpoint-screen.yml'
      - 'scripts/stage1a_nli_checkpoint_screen.py'
      - 'tests/test_stage1a_nli_checkpoint_screen.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkpoint-screen:
    name: Screen ${{ matrix.checkpoint }}
    strategy:
      fail-fast: false
      matrix:
        checkpoint: [deberta, modernbert]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers>=4.50,<5" sentencepiece protobuf pytest
      - name: Test selection and output semantics
        run: |
          python -m py_compile scripts/stage1a_nli_checkpoint_screen.py
          python -m pytest -q tests/test_stage1a_nli_checkpoint_screen.py
      - name: Run 50-review screening
        run: |
          python -u scripts/stage1a_nli_checkpoint_screen.py --model ${{ matrix.checkpoint }} --limit 50 --batch-size 8 --output reports/stage1a_nli_screen_${{ matrix.checkpoint }}
      - name: Verify 50 reviews, all locations, 60 hypotheses
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          alias=os.environ['CHECKPOINT']
          folder=Path(f'reports/stage1a_nli_screen_{alias}')
          s=json.loads((folder/'summary.json').read_text())
          assert s['review_count']==50
          assert s['place_count']==43
          assert s['candidate_count']==60
          assert s['pairs_evaluated']==3000
          assert s['native_label_space'] in ('binary','three_way')
          print('Validated checkpoint',alias,s['native_label_space'])
          PY
        env:
          CHECKPOINT: ${{ matrix.checkpoint }}
      - name: Save complete outputs and partial failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage1a-nli-screen-${{ matrix.checkpoint }}
          path: reports/stage1a_nli_screen_${{ matrix.checkpoint }}/
          if-no-files-found: warn
