name: Stage 1A real review ABSA transfer comparison

on:
  push:
    paths:
      - '.github/workflows/stage1a-absa-real-review-transfer.yml'
      - 'scripts/stage1a_absa_real_review_comparison.py'
      - 'scripts/stage1a_gts_joint_aste_probe.py'
      - 'tests/test_stage1a_absa_real_review_comparison.py'
      - 'data/evaluation/stage1a_absa_real_review_targets_v1.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  real-review-aste:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Source compile and evaluation unit tests
        run: |
          python -m py_compile scripts/stage1a_absa_real_review_comparison.py scripts/stage1a_gts_joint_aste_probe.py
          python -m pip install 'pytest>=8,<10'
          python -m pytest -q tests/test_stage1a_absa_real_review_comparison.py tests/test_stage1a_gts_joint_aste_probe.py
      - name: Retrieve existing fixed AOS and dependency reviews
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p reports/absa_real_review_inputs/{aos_t5,dependency}
          gh run download 41861834607 -R "$GH_REPO" -n stage1a-relation-pilot-aos_t5 -D reports/absa_real_review_inputs/aos_t5
          gh run download 41861834607 -R "$GH_REPO" -n stage1a-relation-pilot-dependency -D reports/absa_real_review_inputs/dependency
      - name: Install pretrained joint GTS ASTE checkpoint dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers>=4.41,<5' 'huggingface_hub>=0.25,<1' numpy scikit-learn sentencepiece
      - name: Run GTS ASTE on the same 20 real reviews
        run: |
          python -u scripts/stage1a_gts_joint_aste_probe.py \
            --real-reviews \
            --input reports/absa_real_review_inputs/aos_t5/review_cases.jsonl \
            --output reports/absa_real_review_transfer/gts_reviews.jsonl
      - name: Score partially annotated target recovery for three methods
        run: |
          python scripts/stage1a_absa_real_review_comparison.py \
            --references data/evaluation/stage1a_absa_real_review_targets_v1.json \
            --aos reports/absa_real_review_inputs/aos_t5/review_cases.jsonl \
            --dependency reports/absa_real_review_inputs/dependency/review_cases.jsonl \
            --gts reports/absa_real_review_transfer/gts_reviews.jsonl \
            --output reports/absa_real_review_transfer
      - name: Assert 20 real review records, fixed target count and all methods
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=Path('reports/absa_real_review_transfer')
          summary=json.loads((d/'summary.json').read_text())
          assert summary['n_reviews']==20
          assert summary['n_reference_targets']==29
          assert set(summary['methods'])=={'aos_t5','dependency_rules','gts_joint_aste'}
          items=[json.loads(s) for s in (d/'side_by_side.jsonl').read_text().splitlines() if s]
          assert len(items)==20 and len({x['row'] for x in items})==20
          for m in summary['methods'].values():
              assert m['reference_targets']==29
              assert 0<=m['targets_recovered']<=29
          print('Real review provenance and target recovery verified')
          PY
      - name: Upload complete raw relation predictions and per-review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage1a-absa-real-review-transfer-v1
          path: reports/absa_real_review_transfer/
          if-no-files-found: warn
