name: Stage 1A M2b controlled claim-level NLI

on:
  push:
    paths:
      - '.github/workflows/stage1a-m2b-claim-nli.yml'
      - 'scripts/stage1a_m2b_claim_nli.py'
      - 'tests/test_stage1a_m2b_claim_nli.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  claim-level-nli:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax and logic tests BEFORE model downloads
        run: |
          python -m pip install 'pytest>=8,<10'
          python -m py_compile scripts/stage1a_m2b_claim_nli.py tests/test_stage1a_m2b_claim_nli.py
          python -m pytest -q tests/test_stage1a_m2b_claim_nli.py
      - name: Install BART pretrained CPU dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers>=4.46,<5'
      - name: Run controlled claim-level NLI
        run: |
          python -u scripts/stage1a_m2b_claim_nli.py --output reports/stage1a_m2b_claim_nli
      - name: Verify completeness, swap eligibility and provenance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          folder=Path('reports/stage1a_m2b_claim_nli')
          summary=json.loads((folder/'summary.json').read_text())
          cases=[json.loads(x) for x in (folder/'cases.jsonl').read_text().splitlines() if x.strip()]
          assert summary['cases']==18
          assert summary['review_emotion_cases']==54==len(cases)
          assert summary['inferences']==sum(5+len(c['claims']) for c in cases)
          assert sum(x['swap_eligible'] for x in cases)==21
          assert all((x['structured']['label'] in ('entailment','neutral','contradiction'))
                     for x in cases)
          assert all(x['premises']['structured'] != x['premises']['swapped']
                     for x in cases if x['swap_eligible'])
          print('Validated',summary['inferences'],'NLI evaluations on',summary['cases'],'controlled cases')
          PY
      - name: Upload results even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage1a-m2b-claim-nli
          path: reports/stage1a_m2b_claim_nli/
          if-no-files-found: warn
