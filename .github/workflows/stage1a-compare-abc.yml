name: Stage 1A compare NLI vs multi-hypothesis vs ABSA-NLI

on:
  push:
    paths:
      - '.github/workflows/stage1a-compare-abc.yml'
      - 'scripts/stage1a_compare_abc.py'
      - 'tests/test_stage1a_absa_interface.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage1a-abc:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers>=4.41,<5" sentencepiece protobuf pytest
      - name: Preflight ABSA tokenizer
        run: |
          python - <<'PY'
          from transformers import AutoTokenizer
          name = "yangheng/deberta-v3-base-end2end-absa"
          tokenizer = AutoTokenizer.from_pretrained(name, use_fast=True)
          print("ABSA tokenizer:", type(tokenizer).__name__, "fast:", tokenizer.is_fast)
          assert tokenizer.is_fast, "ABSA extraction needs fast tokenizer offsets"
          PY
      - name: Validate Python syntax
        run: python -m py_compile scripts/stage1a_compare_abc.py scripts/stage1a_text_pilot.py
      - name: Test ABSA pipeline interface
        run: python -m pytest -q tests/test_stage1a_absa_interface.py
      - name: Run all three real pretrained approaches
        run: python scripts/stage1a_compare_abc.py --output reports/stage1a_abc
      - name: Print result summary
        if: always()
        run: |
          if test -f reports/stage1a_abc/summary.json; then
            cat reports/stage1a_abc/summary.json
          else
            echo 'Experiment did not produce summary; see failed step logs.'
          fi
      - name: Upload auditable outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage1a-abc-comparison
          path: reports/stage1a_abc/
          if-no-files-found: warn
