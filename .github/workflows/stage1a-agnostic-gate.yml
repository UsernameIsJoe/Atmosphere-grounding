name: Stage 1A emotion-agnostic atmospheric relevance gate (real reviews)
run-name: Agnostic gate real-data evaluation
on:
  push:
    paths:
      - "scripts/stage1a_agnostic_gate.py"
      - ".github/workflows/stage1a-agnostic-gate.yml"
  workflow_dispatch:
jobs:
  five_real_reviews:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install semantic encoder
        run: python -m pip install --quiet "torch>=2.3,<3" "transformers>=4.45,<5" "sentence-transformers>=3,<6"
      - name: Source and unique-clause check without inference
        run: python scripts/stage1a_agnostic_gate.py --config configs/stage1a_evidence_first_5.json --prepare-only
      - name: Score 20 original clauses / five real reviews (no LLM)
        run: python scripts/stage1a_agnostic_gate.py --config configs/stage1a_evidence_first_5.json --output reports/stage1a_agnostic_gate_5
      - name: Publish scored clauses and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage1a-agnostic-gate-five-real-reviews
          path: |
            reports/stage1a_agnostic_gate_5/scores.jsonl
            reports/stage1a_agnostic_gate_5/diagnostics.json
          if-no-files-found: warn
