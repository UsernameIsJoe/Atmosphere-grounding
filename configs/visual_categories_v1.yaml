# ADE20K-style class names (Mask2Former semantic pipeline labels, lowercase)
seg_class_maps:
  sky_openness: [sky]
  building_enclosure: [building, house, skyscraper, wall, fence, railing]
  vegetation_enclosure: [tree, grass, plant, flower, palm, field]
  ground_openness: [road, sidewalk, floor, path, earth, sand, runway, stairs]
  tree: [tree, palm]
  canopy_shade_plant: [tree, palm]
  lawn_groundcover: [grass, field]
  path_walkway: [road, sidewalk, path, floor]
  plaza_hardscape: [road, sidewalk, floor, path]
  building_mass: [building, house, skyscraper]
  facade_frontage: [building, house, wall, window, door]
  paving_type: [road, sidewalk, floor, path]
  soft_ground: [earth, sand, field, grass]
  water_surface: [water, sea, river, pool]
  water_body: [water, river, pool, sea]

# family_id -> metric formula id (implemented in ground/visual_categories.py)
metric_formulas:
  brightness_level: mean_luminance
  luminance_contrast: luminance_std
  color_variety: channel_std_mean
  edge_complexity: gradient_edge_density
  focal_dominance_soft: gradient_edge_density
  # Seg-assisted: mean row of soft-ground/path pixels (higher in frame → more slope cue)
  slope_grade: ground_height_bias

documentation:
  phase1: Docs/visual_categories/phase1_top_level.txt
  phase2: Docs/visual_categories/phase2_subtype_families.txt
  phase3: Docs/visual_categories/phase3_extractors.txt
  phase4: Docs/visual_categories/phase4_extractor_benchmark.txt
