# Visual category ontology v1
# Descriptive image-reading structure for atmosphere grounding.
# NO predefined bindings to atmosphere lexicon labels.
# See Docs/visual_categories/phase{1,2,3}_*.txt for decisions and citations.
#
# Schema is extensible: add categories/families later without renaming existing ids.
# Phrases / seg maps / metric formulas populated from Phase 4 extractor benchmark.

version: 1
status: locked_for_v1
extensible: true
unit_primary: image
unit_aggregate: place

# Locked analysis tools (Phase 3)
tools:
  - id: dino
    name: Grounding DINO
    role: open-vocab localized boxes/phrases
  - id: seg
    name: Semantic segmentation
    role: pixel or view-factor fractions
  - id: siglip
    name: SigLIP
    role: soft image-phrase similarity
  - id: metric
    name: Image metrics
    role: contrast brightness complexity entropy proxies

# Runtime defaults for extractors (overridable in cambridge_pilot.yaml)
extractor_settings:
  dino_phrase_chunk_size: 20
  dino_box_threshold: 0.25
  # Lower threshold for rare/small objects that failed Phase 4 hit-rate checks
  dino_box_threshold_by_family:
    bicycle: 0.18
    bike_facilities: 0.18
    light_fixture: 0.20
    crossing: 0.20
    railing: 0.20
    stairs: 0.20
    fence: 0.20
    gate: 0.20
    shrub: 0.20
    rock_landform: 0.20
    paving_type: 0.20
    water_surface: 0.20
    facade_frontage: 0.20
    wall: 0.20
  siglip_score_min: 0.0
  segmentation_model: facebook/mask2former-swin-small-ade-semantic

categories:
  - id: objects_furnishings
    name: Objects & furnishings
    extensible: true
    families:
      - id: seating
        extractors: [dino]
      - id: play
        extractors: [dino]
      - id: service_amenity
        extractors: [dino]
      - id: bike_facilities
        extractors: [dino]
      - id: other_amenity
        extractors: [dino]

  - id: vegetation
    name: Vegetation
    extensible: true
    families:
      - id: tree
        extractors: [dino, seg]
      - id: canopy_shade_plant
        extractors: [dino, seg]
      - id: lawn_groundcover
        extractors: [dino, seg]
      - id: planting_bed
        extractors: [dino]
      - id: shrub
        extractors: [dino]

  - id: circulation_access
    name: Circulation & access
    extensible: true
    families:
      - id: path_walkway
        extractors: [dino, seg]
      - id: plaza_hardscape
        extractors: [dino, seg]
      - id: stairs
        extractors: [dino]
      - id: entrance_threshold
        extractors: [dino]
      - id: crossing
        extractors: [dino]

  - id: boundaries_edges
    name: Boundaries & edges
    extensible: true
    families:
      - id: fence
        extractors: [dino]
      - id: wall
        extractors: [dino]
      - id: gate
        extractors: [dino]
      - id: railing
        extractors: [dino]
      - id: hedge
        extractors: [dino]

  - id: facade_built_form
    name: Facade & built form
    extensible: true
    families:
      - id: building_mass
        extractors: [seg, dino]
      - id: facade_frontage
        extractors: [dino, seg]
      - id: opening
        extractors: [dino]
      - id: canopy_awning
        extractors: [dino]

  - id: light
    name: Light
    extensible: true
    families:
      - id: light_fixture
        extractors: [dino]
      - id: lit_area_soft
        extractors: [siglip]
        soft: true
      - id: brightness_level
        extractors: [metric]

  - id: materiality_surface
    name: Materiality & surface
    extensible: true
    families:
      - id: paving_type
        extractors: [dino, seg]
      - id: soft_ground
        extractors: [dino, seg]
      - id: hard_vertical
        extractors: [dino]
      - id: water_surface
        extractors: [seg, dino]

  - id: water_terrain
    name: Water & terrain
    extensible: true
    families:
      - id: fountain
        extractors: [dino]
      - id: water_body
        extractors: [dino, seg]
      # Phase 4: DINO-style metric for slope not usable; keep SigLIP + seg-based proxy
      - id: slope_grade
        extractors: [siglip, metric]
        soft: true
      - id: rock_landform
        extractors: [dino]

  - id: social_presence
    name: Social presence
    extensible: true
    families:
      - id: people
        extractors: [dino]
      - id: bicycle
        extractors: [dino]
      # Phase 4: DINO hit_rate=0 for gathering; SigLIP only
      - id: gathering_cluster_soft
        extractors: [siglip]
        soft: true

  - id: spatial_structure
    name: Spatial structure
    extensible: true
    families:
      - id: sky_openness
        extractors: [seg, siglip]
      - id: building_enclosure
        extractors: [seg, siglip]
      - id: vegetation_enclosure
        extractors: [seg, siglip]
      - id: ground_openness
        extractors: [seg, siglip]

  - id: composition_contrast
    name: Composition & contrast
    extensible: true
    families:
      - id: luminance_contrast
        extractors: [metric]
      - id: color_variety
        extractors: [metric]
      - id: edge_complexity
        extractors: [metric]
      - id: focal_dominance_soft
        extractors: [siglip, metric]
        soft: true

  - id: wayfinding_information
    name: Wayfinding & information
    extensible: true
    families:
      - id: sign
        extractors: [dino]
      - id: landmark_object
        extractors: [dino, siglip]
      - id: map_board
        extractors: [dino]

